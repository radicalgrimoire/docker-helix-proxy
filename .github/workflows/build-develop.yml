name: build-develop

on:
  schedule:
    # JST 月曜朝9時 = UTC 0時（JST = UTC + 9時間）
    - cron: '0 0 * * 1'

  workflow_dispatch: {}

jobs:
  # Run tests.
  # See also https://docs.docker.com/docker-hub/builds/automated-testing/
  # if: github.event_name == 'push' || github.event_name == 'pull_request'
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  # Uses external reusable workflow for day checking logic
  check-day:
    uses: radicalgrimoire/radicalgrimoire/.github/workflows/check-day.yml@main
    with:
      schedule_type: 'weekly'
      target_value: '1'      # Monday
      timezone: 'Asia/Tokyo'


  # Push image to GitHub Packages.
  # See also https://docs.docker.com/docker-hub/builds/
  # TAG_SUFFIX="nightly-$(date +'%Y%m%d')"
  push:
    uses: ./.github/workflows/publish.yml
    needs: [test, check-day]
    if: needs.check-day.outputs.should-push == 'true'
    secrets: inherit
